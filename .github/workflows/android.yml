name: android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/dsh-mobile.apk
          ls -l out
          sha256sum out/dsh-mobile.apk | tee out/dsh-mobile.apk.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-apk
          path: out/*
          if-no-files-found: error

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/dsh-mobile.apk out/dsh-mobile.apk.sha256 \
            --title "DSH Mobile (latest)" \
            --notes "Auto-built from ${{ github.sha }}. Install on Android 8.0+."
